# Linux course environment.
# Kept separate so Linux learners can pin or extend Linux-only system integration later.
name: aiops-anomaly-zero-to-hero
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - numpy>=1.26,<3
  - pandas>=2.0,<4
  - scipy>=1.12,<2
  - scikit-learn>=1.4,<2
  - statsmodels>=0.14
  - shap>=0.46
  - matplotlib>=3.9
  # Imported directly by the labs rather than reached through matplotlib and ipykernel.
  # A transitive dependency that a lab imports by name is a dependency of the lab.
  - cycler>=0.12
  - ipython>=8.18
  - ipykernel>=6.29
  - requests>=2.31
  - pyyaml>=6.0
  - pytest>=8.0
  - pytest-cov>=5.0
  - prometheus_client>=0.20
