# macOS course environment.
# Use this when you want platform-explicit macOS setup.
name: aiops-anomaly-zero-to-hero
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - numpy>=1.26,<3
  - pandas>=2.0,<4
  - scipy>=1.12,<2
  - scikit-learn>=1.4,<2
  - matplotlib>=3.9
  - ipykernel>=6.29
  - requests>=2.31
  - pyyaml>=6.0
  - pytest>=8.0
  - pytest-cov>=5.0
  - appnope>=0.1
  - prometheus_client>=0.20
  # --- Week 6 (labs/workshop/06_forecasting + 07_root_cause_analysis) ---
  - prophet>=1.1          # Lab 06 forecasting model: trend + seasonality + event regressor h(t)
  - networkx>=3.0         # Lab 07 topology graph (downstream reach in the ranking)
  - statsmodels>=0.14     # Lab 07 Granger causality (F-test cross-check)
