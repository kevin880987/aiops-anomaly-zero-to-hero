global:
  scrape_interval: 250ms
  evaluation_interval: 250ms

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: lab05-replayer
    static_configs:
      - targets: [replayer:9200]

  - job_name: lab05-receiver
    static_configs:
      - targets: [receiver:9300]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
