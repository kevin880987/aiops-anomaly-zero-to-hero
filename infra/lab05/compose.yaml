name: aiops-lab05

services:
  replayer:
    build:
      context: ./replayer
    ports:
      - "${LAB05_REPLAYER_PORT:-9200}:9200"
    environment:
      LAB05_METRICS_PATH: /data/lab05_replay_metrics.csv
      LAB05_EVENTS_PATH: /data/lab05_event_catalog.csv
      LAB05_SCRAPE_INTERVAL_SECONDS: "0.25"
    volumes:
      - ../../data/synthetic/lab05_replay_metrics.csv:/data/lab05_replay_metrics.csv:ro
      - ../../data/synthetic/lab05_event_catalog.csv:/data/lab05_event_catalog.csv:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/-/healthy')"]
      interval: 2s
      timeout: 1s
      retries: 20
    networks: [lab05]

  receiver:
    build:
      context: ./receiver
    ports:
      - "${LAB05_RECEIVER_PORT:-9300}:9300"
    volumes:
      - receiver-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9300/-/healthy')"]
      interval: 2s
      timeout: 1s
      retries: 20
    networks: [lab05]

  alertmanager:
    image: prom/alertmanager:v0.32.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${LAB05_ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    depends_on:
      receiver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/healthy"]
      interval: 2s
      timeout: 1s
      retries: 20
    networks: [lab05]

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
      - --web.enable-lifecycle
    ports:
      - "${LAB05_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      replayer:
        condition: service_healthy
      receiver:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 2s
      timeout: 1s
      retries: 20
    networks: [lab05]

  grafana:
    image: grafana/grafana:13.1.0
    ports:
      - "${LAB05_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 2s
      timeout: 1s
      retries: 30
    networks: [lab05]

networks:
  lab05:

volumes:
  prometheus-data:
  alertmanager-data:
  receiver-data:
  grafana-data:
