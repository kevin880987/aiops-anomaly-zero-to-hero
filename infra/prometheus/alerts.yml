# Recording and alert rules over node_exporter, the same official exporter the
# workshop scrapes. Every metric here comes from a real interface on the machine
# running Prometheus, so a cadet can make these rules fire by downloading a file.
#
# The features mirror what Lab 01 computes on the telemetry CSV. Reading the two
# side by side is the point: a rate in PromQL and a per-interval delta in pandas
# are the same idea expressed against different storage.
#
# IFACE is en0 on macOS. Linux is usually eth0 or enp*s*, Windows an adapter
# description. Change the device matcher below to whichever carries your traffic;
# `topk(3, rate(node_network_receive_bytes_total[5m]))` in Explore will tell you.

groups:

  - name: network_features
    interval: 5s
    rules:

      # Counters must be differenced before they mean anything. rate() over a
      # 1m window is the PromQL spelling of the per-interval delta in Lab 01.
      - record: net:rx_bytes:rate1m
        expr: rate(node_network_receive_bytes_total{device=~"en0|eth0"}[1m])

      - record: net:tx_bytes:rate1m
        expr: rate(node_network_transmit_bytes_total{device=~"en0|eth0"}[1m])

      - record: net:traffic_bps
        expr: net:rx_bytes:rate1m + net:tx_bytes:rate1m

      - record: net:packets_pps
        expr: >
          rate(node_network_receive_packets_total{device=~"en0|eth0"}[1m])
          + rate(node_network_transmit_packets_total{device=~"en0|eth0"}[1m])

      # Mean packet size. Lab 01 shows this is the feature that sees a scan when
      # byte volume does not, because packet count and packet size move against
      # each other and their product barely changes.
      - record: net:avg_pkt_bytes
        expr: net:traffic_bps / clamp_min(net:packets_pps, 1)

      - record: net:error_rate
        expr: >
          (rate(node_network_receive_errs_total{device=~"en0|eth0"}[1m])
           + rate(node_network_transmit_errs_total{device=~"en0|eth0"}[1m]))
          / clamp_min(net:packets_pps, 1)

      - record: net:discard_rate
        expr: >
          rate(node_network_receive_drop_total{device=~"en0|eth0"}[1m])
          / clamp_min(net:packets_pps, 1)

      - record: net:multicast_ratio
        expr: >
          rate(node_network_receive_multicast_total{device=~"en0|eth0"}[1m])
          / clamp_min(net:packets_pps, 1)

      # A rolling baseline and its spread, which is Lab 01's rolling mean written
      # as a recording rule. stddev_over_time is the fragile half: the very spike
      # you want to catch inflates the denominator that would have caught it.
      - record: net:traffic_bps:mean30m
        expr: avg_over_time(net:traffic_bps[30m])

      - record: net:traffic_bps:stddev30m
        expr: stddev_over_time(net:traffic_bps[30m])

      - record: net:traffic_bps:zscore
        expr: >
          (net:traffic_bps - net:traffic_bps:mean30m)
          / clamp_min(net:traffic_bps:stddev30m, 1)

  - name: network_anomaly_detection
    interval: 5s
    rules:

      # `for:` is the duration gate. It is the same deadband Lab 02 applies as
      # "n consecutive samples", and it is why a single scrape over the line does
      # not page anyone.
      - alert: TrafficSurge
        expr: net:traffic_bps:zscore > 3
        for: 1m
        labels:
          severity: warning
          anomaly_type: traffic_surge
        annotations:
          summary: "Traffic surge on {{ $labels.device }}"
          description: >
            {{ $labels.device }} is {{ $value | printf "%.1f" }} standard
            deviations above its 30 minute mean. Lab 02 threshold: z > 3.

      - alert: TrafficDrop
        expr: net:traffic_bps:zscore < -3
        for: 2m
        labels:
          severity: warning
          anomaly_type: traffic_drop
        annotations:
          summary: "Traffic drop on {{ $labels.device }}"
          description: >
            {{ $labels.device }} fell to {{ $value | printf "%.1f" }} standard
            deviations below its 30 minute mean. Check link state and routing.

      - alert: PacketSizeCollapse
        expr: net:avg_pkt_bytes < 200 and net:packets_pps > 100
        for: 2m
        labels:
          severity: warning
          anomaly_type: small_packet_flood
        annotations:
          summary: "Mean packet size collapsed on {{ $labels.device }}"
          description: >
            {{ $value | printf "%.0f" }} bytes per packet while packet rate is
            high. This is the shape Lab 01 event B has, and byte volume alone
            does not show it.

      - alert: ErrorRateSurge
        expr: net:error_rate > 0.01
        for: 1m
        labels:
          severity: critical
          anomaly_type: error_burst
        annotations:
          summary: "Error rate above 1% on {{ $labels.device }}"
          description: >
            {{ $value | printf "%.3f" }} errors per packet. A fixed threshold is
            correct here: Lab 01 shows error rate is zero almost always, so it
            has no spread for a z-score to divide by.
