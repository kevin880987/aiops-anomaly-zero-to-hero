# Windows。windows_exporter 聽在 9182，node_exporter 用的是 9100。
#
# 三個 scrape job，一條閉環：exporter 曝露原始 OS 指標，Prometheus 抓進來存著，
# detector.py 回頭查 Prometheus、算出分數、把分數曝露在 :9200/metrics，Prometheus
# 再把分數當成一般指標抓回來。分數進了 Prometheus 之後，Grafana 與 alerts.yml
# 對待它的方式，就跟對待 windows_exporter 的指標沒有分別。
#
# detector.py 在 labs/workshop/ 底下，Lab 00 會啟動它。沒有啟動的時候這個 job
# 的 up 是 0，DetectorDown 這條規則會響，其餘兩個 job 不受影響。

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 原始訊號：這台機器的網路與 CPU counter。
  - job_name: "windows-exporter"
    static_configs:
      - targets: ["localhost:9182"]

  # 分數：labs/workshop/detector.py 算出來的。
  - job_name: "aiops-detector"
    static_configs:
      - targets: ["localhost:9200"]
