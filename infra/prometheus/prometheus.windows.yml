# Windows. windows_exporter listens on 9182 where node_exporter uses 9100.
#
# Two jobs run by default, both official binaries. The workshop track ships no
# exporter of its own: lab results reach Grafana as CSV read by the Infinity
# datasource, because a month of history cannot be pushed into a pull-based
# store without a replay trick that teaches the wrong lesson.
#
# The self-study track does expose its CSVs as metrics. Uncomment the last two
# jobs when you work through labs/self-study, and start the matching exporter.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "windows-exporter"
    static_configs:
      - targets: ["localhost:9182"]

  # Self-study only. python infra/rrd_exporter.py
  # - job_name: "rrd-exporter"
  #   static_configs:
  #     - targets: ["localhost:8000"]

  # Self-study only. python infra/python_results_exporter.py
  # - job_name: "python-results-exporter"
  #   static_configs:
  #     - targets: ["localhost:8010"]
