# Week 6 的規則檔。附加在 alerts.yml 之上，不動它原本的內容。
#
# 要啟用，在 prometheus.<os>.yml 的 rule_files 加一行就好，原本那一行留著：
#
#     rule_files:
#       - "alerts.yml"
#       - "forecast_alerts.yml"     # <- 新增，附加
#
# 訊號來自 labs/workshop/results_exporter.py，它把 Lab 06 算完寫出的 CSV 重播成
# aiops_python_result。所以這裡的規則跟 alerts.yml 的 TrafficAnomaly 是同一件事：規則不
# 知道分數是誰算的，也不需要知道。差別只在那邊的分數來自 detector.py 的滾動 z，這邊的
# 分數來自 notebook 裡配適的 Prophet 加上殘差 SPC。
#
# 兩條告警刻意分成兩種 alert_kind：
#   predictive  預測值正在往容量走，事情還沒發生
#   reactive    實際值破了模型的期望，事情已經在發生
#
# 重播模式下有一個必須先講清楚的限制。Prometheus 的 [1h]、for: 這些窗口量的是牆上時間，
# 不是 CSV 裡的資料時間。REPLAY_SPEED_X 預設 3600 倍速時，牆上一秒等於資料的一小時，所以
# 下面 predict_linear 的外推長度不能拿去跟 notebook 的「30 分鐘後」對齊，它只用來示範
# 「Prometheus 自己也做得出一個很粗的外推」。真正的 30 分鐘預測是 notebook 算好之後，以
# forecast_30m 這個欄位送進來的。

groups:

  - name: week6_forecast
    interval: 5s
    rules:

      # Prometheus 內建的外推。跟 notebook 的 forecast_30m 擺在同一張 panel 上，就看得出
      # 一條直線的外推跟一個有季節性的模型差在哪裡。
      - record: week6:traffic_predict_linear
        expr: predict_linear(aiops_python_result{column="traffic_total"}[5m], 1800)

      # 預測值離容量還有多少空間，0 到 1。1 代表預測值已經頂到容量。
      # capacity 是 notebook 算好帶進來的欄位，不是這裡估的，所以跟 Lab 06 的門檻一致。
      # ignoring(column) 是這裡的關鍵：兩邊是同一列 CSV 的兩個欄位，除了 column 之外每個
      # label 都一樣，不把 column 排除掉，PromQL 會找不到配對而回空集合。
      - record: week6:capacity_headroom_used
        expr: >
          aiops_python_result{column="forecast_30m"}
          / ignoring(column) clamp_min(aiops_python_result{column="capacity"}, 1)

  - name: week6_forecast_alerts
    interval: 5s
    rules:

      # 預測性告警。notebook 的 early_warning_30m 是同一條政策的另一種寫法，兩邊都放是
      # 刻意的：政策寫在 Prometheus 這一側，值班的人不必等 notebook 重跑才看得到。
      - alert: PredictiveCapacityWarning
        expr: >
          aiops_python_result{column="forecast_30m"}
          > ignoring(column) (0.8 * aiops_python_result{column="capacity"})
        for: 30s
        labels:
          severity: warning
          source: week6_notebook
          alert_kind: predictive
        annotations:
          summary: '{{ $labels.port_id }} 的 30 分鐘預測值正在往容量走'
          description: >
            預測值超過容量的 80%。這條在硬上限之前就會響，買到的時間拿去查排程備份、
            確認容量、或改上游路由。門檻與容量都跟 Lab 06 notebook 用的同一組。

      # 反應性告警。殘差 SPC，跟 alerts.yml 的 TrafficAnomaly 是同一種形狀，只是分數換成
      # 「實際值離 Prophet 的期望幾個 sigma」。
      - alert: ForecastResidualAnomaly
        expr: abs(aiops_python_result{column="resid_z"}) > 3
        for: 30s
        labels:
          severity: warning
          source: week6_notebook
          alert_kind: reactive
        annotations:
          summary: '{{ $labels.port_id }} 的實際值偏離預測 {{ $value | printf "%.1f" }} 個 sigma'
          description: >
            模型期望的是另一個值。predictive 那條講的是還沒發生的事，這條講的是已經發生的事，
            兩條的處理速度不一樣，所以 alert_kind 分開標。

      # 重播沒有在跑的時候，上面兩條會安靜地永遠不響。這條負責把「安靜」跟「沒事」分開。
      - alert: Week6ReplayDown
        expr: up{job="week6-results-exporter"} == 0
        for: 1m
        labels:
          severity: info
          source: week6_notebook
        annotations:
          summary: 'Week 6 的重播沒有在跑'
          description: >
            labs/workshop/results_exporter.py 沒有啟動，或還沒被抓到。這在沒有上 Week 6 的
            時候是正常的，其餘 job 不受影響。
